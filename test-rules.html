<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Rule box test</title>
<!-- The boxes an export draws, drawn (viewer/rules.js). The column grid is
     tested in node (test-rules.mjs); what needs a page is the measuring and
     the setting, so this one builds a form's caption and notice out of the
     same glyphs PDF-Linker writes and reads back where every bar landed —
     both ways the reader draws a page: side by side on a PDF's grid, where
     each row is positioned on its own, and the ordinary flowing view. Then a
     pleading's caption on numbered paper, where a row's indent is in its
     number's spaces and its first cell is set in by it (columns.js).
     Open it over http (an ES module will not import from a file:// page):
       npx http-server -p 8080 . → http://127.0.0.1:8080/test-rules.html -->
<link rel="stylesheet" href="viewer/text-reader.css">
<style>
  #report { font-family: monospace; padding: 16px 20px; white-space: pre; }
  #report .pass { color: #1b7f3b; }
  #report .fail { color: #b3261e; font-weight: 700; }
  #stage { position: absolute; left: -4000px; top: 0; width: 1400px; }
</style>
</head>
<body>
<div id="report">running…</div>
<div id="stage"><div id="pages">
  <section class="tpage matched" data-index="0"><div class="page-inner" style="height:260px">
    <div class="page-body fixed" id="laid"></div></div></section>
  <section class="tpage" data-index="1"><div class="page-inner">
    <div class="page-body" id="flow"></div></div></section>
  <section class="tpage" data-index="2" style="--reader-size-eff:16px"><div class="page-inner" style="height:auto">
    <div class="page-body numbered" id="caption"></div></div></section>
  <section class="tpage matched" data-index="3"><div class="page-inner" style="height:200px">
    <div class="page-body fixed cgrid" id="grid"></div></div></section>
  <section class="tpage matched" data-index="4"><div class="page-inner" style="height:200px">
    <div class="page-body fixed cgrid" id="grid2" style="width:600px"></div></div></section>
</div></div>
<script type="module">
import { dressLines, fitRuleRows } from "./viewer/rules.js";
import { dressColumns, charWidth } from "./viewer/columns.js";
import { gutterPrefix } from "./viewer/textdoc.js";

// The grid's character in the page's font, as the reader sets it on the root.
const cw = charWidth(getComputedStyle(document.getElementById("flow")).fontFamily);
document.documentElement.style.setProperty("--col-n", String(cw.char));
document.documentElement.style.setProperty("--col-sp-n", String(cw.space));

// An MC-350EX caption and its NOTICE TO PETITIONER as PDF-Linker writes them:
// bars at 5, 95 and 146 down the caption, at 5 and 146 through the notice —
// and one notice line whose text pushed its closing bar out to 148, which is
// the same rule and not a column of its own.
const cell = (s, n) => (s + " ".repeat(Math.max(0, n - s.length))).slice(0, n);
const row3 = (a, b) => "     │" + cell(a, 89) + "│" + cell(b, 50) + "│";
const row2 = (a, w = 140) => "     │" + cell(a, w) + "│";
const rule = (l, m, r) => "     " + l + "─".repeat(89) + m + "─".repeat(50) + r;
// [text, the top and left the PDF's grid gave the row]
const art = [
  [rule("┌", "┬", "┐"), 10, 20],
  [row3(" ATTORNEY OR PARTY WITHOUT ATTORNEY     STATE BAR NUMBER: 309664", "        FOR COURT USE ONLY"), 30, 20],
  [row3(" NAME: Headington Grantham", ""), 50, 20],
  [rule("├", "┴", "┤"), 70, 20],
  [row2("                    NOTICE TO PETITIONER"), 90, 44],
  [row2(" You must use this form to request expedited court approval of a qualifying (1) compromise of a minor's disputed claim, (2) compromise"), 110, 44],
  [row2(" of a pending action or proceeding in which a minor or a person with a disability (including a conservatee) is a party, or (3) disposition of", 142), 130, 46],
  [row2(" the proceeds of a judgment for a minor or person with a disability. (See Code Civ. Proc., § 372.) You"), 150, 20],
  ["     └" + "─".repeat(140) + "┘", 170, 20],
];

for (const id of ["laid", "flow"]) {
  const body = document.getElementById(id);
  for (const [text, top, left] of art) {
    const line = document.createElement("div");
    line.className = "line";
    const lt = document.createElement("span");
    lt.className = "lt";
    lt.textContent = text;
    line.appendChild(lt);
    body.appendChild(line);
    if (id !== "laid") continue;
    line.style.top = top + "px";
    line.style.left = left + "px";
    line.style.fontSize = "11px";
    line.style.lineHeight = "13px";
    line.__laid = `${top}|${left}|11|13`;   // as applyMatchedLayout records it
  }
  dressLines(body);   // …as dressBody does it: the boxes, then the columns
  dressColumns(body);
}

// A caption on pleading paper, as the reader builds a numbered line: the
// number and the spaces after it in the margin (.gutter), the text in .lt.
// "Plaintiff," is fifteen characters in, and those fifteen are its number's
// spaces. Below it, a rule the export starts sixteen characters in, over a
// row whose bar stands a character to the left of the rule's (its own table,
// .rt) and whose text is narrower than the rule's indent.
const L = 40;
const cap = (n, a, b = "") => (n ? String(n).padStart(2) + "  " : "    ") + cell(a, L) + "│" + (b ? " " + b : "");
const capRule = (n, m) => String(n).padStart(2) + "  " + "─".repeat(L) + m + "─".repeat(38);
const caption = [
  capRule(11, "┬"),
  cap(12, "WINDERMERE HAVENWOOD, LLC, a California", "Case No.: 25STCV59720"),
  cap(13, "limited liability company,"),
  cap(0, "", "[Assigned to Hon. A. Judge, Dept. 15]"),
  cap(14, " ".repeat(15) + "Plaintiff,", "COMPLAINT FOR:"),
  cap(15, " ".repeat(6) + "vs.", "1. BREACH OF CONTRACT;"),
  cap(16, "BORROWER ENTERPRISES, INC., a Delaware", "2. BREACH OF GUARANTY"),
  cap(17, " ".repeat(15) + "Defendants.", "DEMAND FOR JURY TRIAL"),
  capRule(18, "┴"),
  "19",
  "20                 Plaintiff alleges as follows:",
  "21",
  "22" + " ".repeat(18) + "─".repeat(5) + "┬" + "─".repeat(6),
  "23  ab" + " ".repeat(18) + "│ cd",
];
{
  const body = document.getElementById("caption");
  for (const text of caption) {
    const line = document.createElement("div");
    line.className = "line";
    const lt = document.createElement("span");
    lt.className = "lt";
    const g = gutterPrefix(text);
    if (g) {
      const gutter = document.createElement("span");
      gutter.className = "gutter";
      const m = g.gutter.match(/^( ?\d{1,2})( *)$/);
      gutter.innerHTML = `<span class="gn">${m[1]}</span>` + (m[2] ? `<span class="gs">${m[2]}</span>` : "");
      line.append(gutter);
      line.classList.add("num");
    }
    lt.textContent = g ? g.rest : text;
    line.append(lt);
    body.append(line);
  }
  dressLines(body);
  dressColumns(body);
}
fitRuleRows(document.getElementById("pages"));

const rowsOf = (id) => [...document.getElementById(id).querySelectorAll(".line")].map((line) => {
  const r = line.getBoundingClientRect();
  return {
    rk: line.dataset.rk,
    bars: [...line.querySelectorAll(".rb")].map((b) => Math.round(b.getBoundingClientRect().left)),
    left: Math.round(r.left), right: Math.round(r.right), top: Math.round(r.top), height: Math.round(r.height),
  };
});

const out = [];
let fails = 0;
const check = (label, ok, note = "") => {
  if (!ok) fails++;
  out.push(`<span class="${ok ? "pass" : "fail"}">  ${ok ? "PASS" : "FAIL"}  ${label}${note && !ok ? "\n        " + note : ""}</span>`);
};
const same = (xs) => xs.every((x) => Math.abs(x - xs[0]) <= 1);
const r1 = (x) => Math.round(x * 10) / 10;

for (const [id, name] of [["laid", "side by side, on the PDF's grid"], ["flow", "the flowing page"]]) {
  const rows = rowsOf(id);
  out.push(name + ":");
  check("every row's first bar stands in one column", same(rows.map((r) => r.bars[0])), rows.map((r) => r.bars[0]).join(" "));
  check("every row's last bar stands in one column, the two-character wobble with them", same(rows.map((r) => r.bars[r.bars.length - 1])), rows.map((r) => r.bars[r.bars.length - 1]).join(" "));
  check("the caption's inner bar is the same column down its four rows", same(rows.slice(0, 4).map((r) => r.bars[1])), rows.slice(0, 4).map((r) => r.bars[1]).join(" "));
  check("a rule row is as wide as the box, not as wide as its glyphs", Math.abs(rows[8].right - rows[7].right) <= 1, `${rows[8].right} vs ${rows[7].right}`);
  check("the notice's rows reach the caption's right edge", Math.abs(rows[4].bars[1] - rows[0].bars[2]) <= 1, `${rows[4].bars[1]} vs ${rows[0].bars[2]}`);
  if (id === "laid") {
    check("every row is given one left edge", same(rows.map((r) => r.left)), rows.map((r) => r.left).join(" "));
    check("each row reaches the row below it", rows.slice(0, -1).every((r, k) => Math.abs(r.top + r.height - rows[k + 1].top) <= 1), rows.map((r) => `${r.top}+${r.height}`).join(" "));
  } else {
    // A box wider than its paper is drawn smaller, and the paper keeps its
    // width: a sheet widened for it put every other page off centre, in a
    // column as wide as the widest box.
    const body = document.getElementById(id);
    const sec = body.closest(".tpage");
    const margin = body.getBoundingClientRect().right - parseFloat(getComputedStyle(body).paddingRight);
    const right = Math.max(...rows.map((r) => r.right));
    check("the sheet keeps the paper's width", Math.abs(sec.getBoundingClientRect().width - 816) <= 1 && !sec.style.width, `${sec.getBoundingClientRect().width} "${sec.style.width}"`);
    check("the box is drawn smaller than the reading size", parseFloat(body.querySelector(".line.rl > .lt").style.fontSize) < 100, body.querySelector(".line.rl > .lt").style.fontSize);
    check("…and ends at the page's right margin", right <= margin + 1 && right >= margin - 4, `${right} vs ${margin}`);
    // Its rows open with five spaces, so its left side stands five of the
    // page's grid characters in from the margin — the grid tightened first,
    // as far as it gives, and drawn smaller with the type past that.
    const lt = body.querySelector(".line.rl > .lt");
    const f = parseFloat(lt.style.fontSize) / 100;
    const unit = cw.char * parseFloat(getComputedStyle(body).fontSize);
    const set = body.__rules || {};
    const from = body.getBoundingClientRect().left + parseFloat(getComputedStyle(body).paddingLeft);
    const in5 = rows[0].bars[0] - from;
    check("…its grid tightened before its type was drawn smaller, and near as far as it gives", set.g >= 0.5 && set.g < 0.6 && f < 1 && Math.abs(set.unit - unit * f * set.g) <= 0.01, JSON.stringify(set) + ` vs ${r1(unit)} ×${f}`);
    check("…its indent with them", Math.abs(in5 - 5 * set.unit) <= 1, `${r1(in5)} vs ${r1(5 * set.unit)}`);
  }
}

// Where a line's text begins: its first character that is not a space.
const textX = (el) => {
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  for (let n = walker.nextNode(); n; n = walker.nextNode()) {
    const i = n.data.search(/\S/);
    if (i < 0) continue;
    const r = document.createRange();
    r.setStart(n, i); r.setEnd(n, i + 1);
    return r.getBoundingClientRect().left;
  }
  return NaN;
};
{
  out.push("a caption on numbered paper:");
  const body = document.getElementById("caption");
  const lines = [...body.querySelectorAll(":scope > .line")];
  const firstCell = (k) => lines[k].querySelector(":scope > .lt > .rc");
  const f = parseFloat(lines[1].querySelector(".lt").style.fontSize || "100") / 100;
  const unit = cw.char * parseFloat(getComputedStyle(body).fontSize) * f;
  const name = textX(firstCell(1));
  const inBy = (k) => textX(firstCell(k)) - name;
  check("\"Plaintiff,\" stands fifteen of the grid's characters in from the party's name", Math.abs(inBy(4) - 15 * unit) <= 1, `${r1(inBy(4))} vs ${r1(15 * unit)}`);
  check("\"vs.\" six", Math.abs(inBy(5) - 6 * unit) <= 1, `${r1(inBy(5))} vs ${r1(6 * unit)}`);
  check("\"Defendants.\" fifteen", Math.abs(inBy(7) - 15 * unit) <= 1, `${r1(inBy(7))} vs ${r1(15 * unit)}`);
  check("…where a line of the page's own indented as far begins", Math.abs(textX(firstCell(4)) - textX(lines[10].querySelector(".lt"))) <= 1, `${r1(textX(firstCell(4)))} vs ${r1(textX(lines[10].querySelector(".lt")))}`);
  const bars = lines.slice(0, 9).map((l) => Math.round(l.querySelector(".rb").getBoundingClientRect().left));
  check("the caption's bar stands in one column down every row, the unnumbered one too", same(bars), bars.join(" "));
  const rule = firstCell(12);
  const ruleFrom = parseFloat(rule.style.backgroundPosition) || 0; // the run's own start in its cell (rules.js, drawRuns)
  check("a rule the export indents starts that far in", rule.classList.contains("rg") && Math.abs(ruleFrom - 16 * unit) <= 1, `${rule.className} ${r1(ruleFrom)} vs ${r1(16 * unit)}`);
  const under = lines.slice(12, 14).map((l) => Math.round(l.querySelector(".rb").getBoundingClientRect().left));
  check("…and the bar of the row under it, its own table, stands under the rule's", same(under), under.join(" "));
}
// Side by side on the export's own grid read back off the PDF (.cgrid; the
// reader writes it on the body as __charGrid), a box is the PDF's box: each
// bar where the grid puts the column the export sets it at, x0 + column ×
// unit, however little of the box its text fills. And a row set larger, in
// bold (CIV-110's notice under its caption), whose text fits the grid but
// whose closing spaces at that size do not, keeps its bar on the PDF's rule —
// the spaces run on unseen (a fixed table, .fit).
{
  out.push("on the export's grid read off the PDF:");
  const body = document.getElementById("grid");
  const rows = [
    "     ┌" + "─".repeat(20) + "┬" + "─".repeat(20) + "┐",
    "     │ NAME:" + " ".repeat(14) + "│ CASE NUMBER:" + " ".repeat(7) + "│",
    "     │ A conformed copy will not be returned   │",
    "     └" + "─".repeat(41) + "┘",
  ];
  const size = [11, 11, 14, 11];
  const ctx = document.createElement("canvas").getContext("2d");
  const font = getComputedStyle(body).fontFamily;
  ctx.font = `700 14px ${font}`;
  // The grid fits the notice's text where the file sets it (its "A" two
  // characters past its bar) and a space more, with half a pixel to spare —
  // but not the three spaces the file ends it with as well.
  const text = ctx.measureText("A conformed copy will not be returned").width;
  const x0 = 30, unit = (text + 0.28 * 14 + 0.5) / 40;
  body.__charGrid = { x0, unit };
  rows.forEach((t, k) => {
    const line = document.createElement("div");
    line.className = "line";
    const lt = document.createElement("span");
    lt.className = "lt";
    lt.textContent = t;
    if (k === 2) lt.style.fontWeight = "700";
    line.appendChild(lt);
    body.appendChild(line);
    ctx.font = `${size[k]}px ${font}`;
    // Laid as applyMatchedLayout lays a box row on the grid: its five
    // opening spaces, drawn at their own width, end where the grid's five do.
    const left = x0 + 5 * unit - ctx.measureText("     ").width;
    const top = 10 + k * 20;
    line.style.cssText = `top:${top}px;left:${left}px;font-size:${size[k]}px;line-height:${size[k] + 4}px`;
    line.__laid = `${top}|${left}|${size[k]}|${size[k] + 4}`;
  });
  dressLines(body);
  dressColumns(body);
  fitRuleRows(body);
  const at = (o) => body.getBoundingClientRect().left + x0 + o * unit;
  const bars = rowsOf("grid").map((r) => r.bars);
  check("every row's first bar stands at its column's place on the grid", bars.every((b) => Math.abs(b[0] - at(5)) <= 1.5), bars.map((b) => b[0]).join(" ") + " vs " + r1(at(5)));
  check("…the caption's inner bar at its", bars.slice(0, 2).every((b) => Math.abs(b[1] - at(26)) <= 2), bars.slice(0, 2).map((b) => b[1]).join(" ") + " vs " + r1(at(26)));
  check("…and every row's last bar at the box's right edge, the larger bold row too", bars.every((b) => Math.abs(b[b.length - 1] - at(47)) <= 3), bars.map((b) => b[b.length - 1]).join(" ") + " vs " + r1(at(47)));
  const notice = body.querySelectorAll(".line")[2];
  check("…its closing spaces running on unseen, the row a fixed table the width of its cells", notice.classList.contains("fit") && getComputedStyle(notice).tableLayout === "fixed" && !!notice.style.width, notice.className + " " + notice.style.width);
  // Off that grid (a page whose PDF gave none) the box is still one box on
  // one grid: its sides and its inner bar straight down every row.
  body.classList.remove("cgrid");
  fitRuleRows(body);
  const off = rowsOf("grid").map((r) => r.bars);
  check("off the PDF's grid, every row's first bar in one column and its last in one", same(off.map((b) => b[0])) && same(off.map((b) => b[b.length - 1])), JSON.stringify(off));
  check("…the inner bar too, in the rows it crosses", Math.abs(off[0][1] - off[1][1]) <= 1, JSON.stringify(off.slice(0, 2)));
  body.classList.add("cgrid");
  fitRuleRows(body);
}
// SUM-100's top: a box at the right margin (the court's, bars at 30 and 47)
// beside the caption's labels, and a notice under it the width of the page (5
// and 47, its top rule meeting the court box's foot at 30). Each row's first
// bar stands at ITS column, not at one lead every row shares — which stood
// the notice's left side under the court box's. The page's type (its form
// number, its page count) ends two characters short of where the grid puts
// column 47 — as SUM-100's does, its export having widened the box for the
// notice's small type — and the box ends where the type does. Then the same
// rows with no record of where they were laid — every one slid back into its
// indent before its box was fitted, as the layout does a box at the right
// margin it finds running past the sheet (MC-011's TOTAL boxes) — squared up
// on the grid all the same.
{
  out.push("two boxes in one stack, on the grid:");
  const body = document.getElementById("grid2");
  const rows = [
    "LABEL:" + " ".repeat(24) + "┌" + "─".repeat(16) + "┐",
    "MORE:" + " ".repeat(25) + "│" + cell(" FOR COURT USE", 16) + "│",
    "     ┌" + "─".repeat(24) + "┴" + "─".repeat(16) + "┤",
    "     │" + cell(" You have been sued. Read the notice.", 41) + "│",
    "     └" + "─".repeat(41) + "┘",
  ];
  const ctx = document.createElement("canvas").getContext("2d");
  const font = getComputedStyle(body).fontFamily;
  ctx.font = `11px ${font}`;
  const x0 = 30, unit = 7, right = x0 + 45 * unit;
  body.__charGrid = { x0, unit, right };
  const laidAt = [];
  rows.forEach((t, k) => {
    const line = document.createElement("div");
    line.className = "line";
    const lt = document.createElement("span");
    lt.className = "lt";
    lt.textContent = t;
    line.appendChild(lt);
    body.appendChild(line);
    const lead = t.search(/\S/);
    const left = x0 + lead * unit - ctx.measureText(" ".repeat(lead)).width;
    const top = 10 + k * 15;
    laidAt.push(left);
    line.style.cssText = `top:${top}px;left:${left}px;font-size:11px;line-height:15px`;
    line.__laid = `${top}|${left}|11|15`;
  });
  dressLines(body);
  dressColumns(body);
  fitRuleRows(body);
  const b0 = body.getBoundingClientRect().left;
  const at = (o) => b0 + x0 + o * unit;
  const bars = rowsOf("grid2").map((r) => r.bars);
  check("the court box's rows stand their first bar at its column, 30", bars.slice(0, 2).every((b) => Math.abs(b[0] - at(30)) <= 1.5), bars.slice(0, 2).map((b) => b[0]).join(" ") + " vs " + r1(at(30)));
  check("…the notice's rows theirs at 5, not under the court box's", bars.slice(2).every((b) => Math.abs(b[0] - at(5)) <= 1.5), bars.slice(2).map((b) => b[0]).join(" ") + " vs " + r1(at(5)));
  check("…the notice's top rule meeting the court box's foot at 30", Math.abs(bars[2][1] - at(30)) <= 2, bars[2][1] + " vs " + r1(at(30)));
  check("every row's last bar ends where the page's type does, not two characters on where the grid runs", bars.every((b) => Math.abs(b[b.length - 1] - (b0 + right)) <= 3), bars.map((b) => b[b.length - 1]).join(" ") + " vs " + r1(b0 + right));
  // …and with no record of where any row was laid, each slid back from it.
  const lines = [...body.querySelectorAll(".line")];
  lines.forEach((line, k) => { line.__laid = null; line.style.left = Math.max(0, laidAt[k] - 12 - 3 * k) + "px"; line.style.width = ""; });
  fitRuleRows(body);
  const slid = rowsOf("grid2").map((r) => r.bars);
  check("rows that all gave up their record still make one box on the grid: one left for every row",
    same(lines.map((l) => parseFloat(l.style.left))), lines.map((l) => l.style.left).join(" "));
  check("…and every bar where it stood when the rows were laid", slid.every((b, k) => b.length === bars[k].length && b.every((x, i) => Math.abs(x - bars[k][i]) <= 1.5)), JSON.stringify(slid) + " vs " + JSON.stringify(bars));
  check("…each row as tall as the gap to the next, its top the one it was laid at, so the box's sides meet",
    lines.slice(0, -1).every((l) => l.style.height === "15px"), lines.map((l) => l.style.height || "-").join(" "));
}
out.push("", `${"=".repeat(52)}`, `FAILURES: ${fails}`);
document.getElementById("report").innerHTML = out.join("\n");
document.title = fails ? `FAIL (${fails})` : "PASS";
window.__fails = fails;
</script>
</body>
</html>
