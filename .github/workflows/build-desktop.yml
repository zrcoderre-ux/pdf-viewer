name: Build PDF+ (desktop)

# Tests PDF+ (desktop/) on Linux and Windows, then builds its Windows
# installer and keeps it as this run's artifact ("PDF+ for Windows" on the
# run's page). Nothing is published from here. On a working branch it runs
# by itself; on main, release-desktop.yml calls it with `version` (which
# stamps that version on the build and adds release notes) and publishes
# what it built. The PWA's deploy is a separate workflow and is not touched
# by this one.

on:
  push:
    # Not main: there release-desktop.yml runs this, and releases the result.
    branches: ["claude/**"]
    paths:
      - "desktop/**"
      - "pwa/**"
      - "viewer/**"
      - "pdfjs/**"
      - "citation-site-rules.js"
      - "test-desktop.mjs"
      - ".github/workflows/build-desktop.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Building a release of this version: stamped on the app, with notes from the commits since the last release"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # In a call this is the caller's name, so a release never cancels, or is
  # cancelled by, a branch build.
  group: ${{ github.workflow }}-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Electron and the packager
        working-directory: desktop
        run: npm ci

      - name: Install Playwright (drives the app; no browsers needed)
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.56.1

      - name: Assemble the app
        run: node desktop/assemble.mjs

      - name: Test
        shell: bash
        env:
          PDFPLUS_REQUIRE_TEST: "1"
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs"
          node test-desktop.mjs

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A release's notes are the commits since the last release's tag.
          fetch-depth: ${{ inputs.version && '0' || '1' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Release notes
        if: ${{ inputs.version }}
        shell: bash
        run: |
          prev="$(git describe --tags --abbrev=0 --match 'pdfplus-v*' HEAD 2>/dev/null || true)"
          # electron-builder puts build/release-notes.md into latest.yml, which
          # is what the update button shows.
          if [ -z "$prev" ]; then
            echo "The first release of PDF+." > desktop/build/release-notes.md
          else
            git log --no-merges --format='- %s' "${prev}..HEAD" -- desktop pwa viewer pdfjs citation-site-rules.js | head -n 60 > desktop/build/release-notes.md
            [ -s desktop/build/release-notes.md ] || echo "No changes to the app since ${prev#pdfplus-v}." > desktop/build/release-notes.md
          fi
          cat desktop/build/release-notes.md

      - name: Install Electron and the packager
        working-directory: desktop
        run: npm ci

      - name: Stamp the release's version
        if: ${{ inputs.version }}
        working-directory: desktop
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build the installer
        working-directory: desktop
        run: npm run dist

      - name: Gather what a release needs
        shell: bash
        run: |
          mkdir -p out
          cp desktop/dist/*.exe desktop/dist/*.exe.blockmap desktop/dist/latest.yml out/
          if [ -f desktop/build/release-notes.md ]; then cp desktop/build/release-notes.md out/; fi
          ls -l out

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: PDF+ for Windows
          path: out/*
          if-no-files-found: error
          retention-days: 30
