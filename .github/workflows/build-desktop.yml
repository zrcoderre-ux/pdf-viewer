name: Build PDF+ (desktop)

# Tests PDF+ (desktop/) on Linux and Windows, then builds its Windows
# installer and keeps it as this run's artifact ("PDF+ for Windows" on the
# run's page), to download and install by hand. Nothing is published: no
# release, no update anyone receives. The PWA's deploy is a separate workflow
# and is not touched by this one.

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "desktop/**"
      - "pwa/**"
      - "viewer/**"
      - "pdfjs/**"
      - "citation-site-rules.js"
      - "test-desktop.mjs"
      - ".github/workflows/build-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Electron and the packager
        working-directory: desktop
        run: npm ci

      - name: Install Playwright (drives the app; no browsers needed)
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.56.1

      - name: Assemble the app
        run: node desktop/assemble.mjs

      - name: Test
        shell: bash
        env:
          PDFPLUS_REQUIRE_TEST: "1"
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs"
          node test-desktop.mjs

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Electron and the packager
        working-directory: desktop
        run: npm ci

      - name: Build the installer
        working-directory: desktop
        run: npm run dist

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: PDF+ for Windows
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
