<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Column cell test</title>
<!-- The columns an export lays out with spaces, held to the PDF's grid side
     by side (viewer/columns.js: dressColumns, fitCells). Where a line is cut
     is tested in node (test-textdoc.mjs); what needs a page is the measuring:
     a piece before a column drawn at its own width wherever the blank before
     the next column has room for it, squeezed only where it would run into
     that column's text and never below three quarters, and a pseudonym never
     cut. Each case is its own page, its grid's character chosen from the
     piece's own measured width so the case lands where it is meant to.
     Open it over http (an ES module will not import from a file:// page):
       npx http-server -p 8080 . → http://127.0.0.1:8080/test-columns.html -->
<link rel="stylesheet" href="viewer/text-reader.css">
<style>
  #report { font-family: monospace; padding: 16px 20px; white-space: pre; }
  #report .pass { color: #1b7f3b; }
  #report .fail { color: #b3261e; font-weight: 700; }
  #stage { position: absolute; left: -4000px; top: 0; width: 1400px; font-family: Georgia, serif; }
  .page-inner { height: 160px; }
</style>
</head>
<body>
<div id="report">running…</div>
<div id="stage"><div id="pages"></div></div>
<script type="module">
import { dressColumns, alignColumns, fitCells, charWidth, CELL_SQUEEZE_MIN } from "./viewer/columns.js";

const stage = document.getElementById("stage");
const pages = document.getElementById("pages");
const SIZE = 16;
const cw = charWidth(getComputedStyle(stage).fontFamily);
document.documentElement.style.setProperty("--col-n", String(cw.char));
document.documentElement.style.setProperty("--col-sp-n", String(cw.space));
const SPACE = cw.space * SIZE;

/** A page laid on the PDF's grid, its lines given as strings and { fake, real, shown } pseudonyms. */
function page(rows, unit) {
  const sec = document.createElement("section");
  sec.className = "tpage matched";
  sec.innerHTML = '<div class="page-inner"><div class="page-body fixed cgrid"></div></div>';
  const body = sec.querySelector(".page-body");
  body.style.setProperty("--grid-em", SIZE + "px");
  body.style.setProperty("--grid-col", unit + "px");
  rows.forEach((parts, k) => {
    const line = document.createElement("div");
    line.className = "line";
    line.style.top = k * 24 + "px";
    line.style.fontSize = SIZE + "px";
    line.style.lineHeight = "20px";
    const lt = document.createElement("span");
    lt.className = "lt";
    for (const p of parts) {
      if (typeof p === "string") { lt.append(p); continue; }
      const s = document.createElement("span");
      s.className = "pn";
      s.contentEditable = "false";
      s.dataset.fake = p.fake;
      s.dataset.real = p.real;
      s.textContent = p.shown === "real" ? p.real : p.fake;
      lt.append(s);
    }
    line.append(lt);
    body.append(line);
  });
  pages.append(sec);
  dressColumns(body);
  return body;
}
/** A piece's own width in the reader's font, at the line's size. */
function natural(parts) {
  const probe = document.createElement("span");
  probe.style.cssText = `position:absolute;white-space:pre;font-size:${SIZE}px`;
  probe.textContent = parts.map((p) => (typeof p === "string" ? p : p.shown === "real" ? p.real : p.fake)).join("");
  stage.append(probe);
  const w = probe.getBoundingClientRect().width;
  probe.remove();
  return w;
}
/** Where a two-column line's cell, its text, and the next column's text stand. */
function measure(body) {
  const cell = body.querySelector(".cc");
  const r = document.createRange();
  r.setStart(cell, 0);
  r.setEndBefore(cell.querySelector(".cg"));
  const next = cell.nextSibling;
  const n = document.createRange();
  n.setStart(next, 0);
  n.setEnd(next, 1);
  const m = /scaleX\(([\d.]+)\)/.exec(cell.style.transform);
  return {
    left: cell.getBoundingClientRect().left,
    textRight: r.getBoundingClientRect().right,
    nextLeft: n.getBoundingClientRect().left,
    min: parseFloat(getComputedStyle(cell).minWidth),
    pad: parseFloat(getComputedStyle(cell).paddingRight),
    scale: m ? parseFloat(m[1]) : 1,
  };
}

const out = [];
let fails = 0;
const check = (label, ok, note = "") => {
  if (!ok) fails++;
  out.push(`<span class="${ok ? "pass" : "fail"}">  ${ok ? "PASS" : "FAIL"}  ${label}${note && !ok ? "\n        " + note : ""}</span>`);
};
const near = (a, b, tol = 1) => Math.abs(a - b) <= tol;
const r1 = (x) => Math.round(x * 10) / 10;

// A two-column line: its left-hand piece, three spaces, the next column. The
// grid's character is chosen so the blank before the next column, a space
// short of it, is `share` of the piece's own width.
const LEFT = "Defendant Acme Holdings Group, Inc.";
const twoCol = (left, share, shown) => {
  const fileLen = left.reduce((n, p) => n + (typeof p === "string" ? p : p.fake).length, 0);
  const cols = fileLen + 3;
  const t = natural(left);
  const unit = (share * t + SPACE) / cols;
  const body = page([[...left, "   ", "Case No. 24STCV01234"]], unit);
  return { body, t, unit, cols };
};

out.push("a piece that fits in the blank before the next column:");
{
  const { body, t } = twoCol([LEFT], 1.03);
  const cell = body.querySelector(".cc");
  const before = measure(body);
  check("the case is one the cell's margin alone would have squeezed", t > before.min - before.pad, `${r1(t)} vs ${r1(before.min - before.pad)}`);
  fitCells([cell]);
  const m = measure(body);
  check("it is drawn at its own width", m.scale === 1 && !cell.style.transform, cell.style.transform);
  check("the next column stays on the grid", near(m.nextLeft - m.left, m.min), `${r1(m.nextLeft - m.left)} vs ${r1(m.min)}`);
  check("…with at least a space between them", m.textRight <= m.nextLeft - SPACE + 1, `${r1(m.textRight)} vs ${r1(m.nextLeft - SPACE)}`);
  fitCells([cell]);
  const again = measure(body);
  check("a second pass finds the same", again.scale === 1 && near(again.nextLeft, m.nextLeft, 0.5), `${again.scale} ${r1(again.nextLeft)} vs ${r1(m.nextLeft)}`);
  cell.firstChild.data += " and Affiliates";
  fitCells([cell]);
  const longer = measure(body);
  check("…and a piece grown since is measured afresh, not held to the old width", longer.scale < 1 && longer.textRight <= longer.nextLeft - SPACE + 1, `${longer.scale} ${r1(longer.textRight)} vs ${r1(longer.nextLeft)}`);
}

out.push("a piece that would run into the next column:");
{
  const { body } = twoCol([LEFT], 0.9);
  fitCells([body.querySelector(".cc")]);
  const m = measure(body);
  check("it is squeezed by what it would overrun, no more", near(m.scale, 0.9, 0.01), String(m.scale));
  check("the next column stays on the grid", near(m.nextLeft - m.left, m.min), `${r1(m.nextLeft - m.left)} vs ${r1(m.min)}`);
  check("…with a space between them", m.textRight <= m.nextLeft - SPACE + 1, `${r1(m.textRight)} vs ${r1(m.nextLeft - SPACE)}`);
}

out.push("a piece far too wide (a real name twice its fake's length):");
{
  const left = ["Plaintiff ", { fake: "Pat Doe", real: "Weddell Of Sharnbrook Of Livesey Brindley", shown: "real" }];
  const { body, t } = twoCol(left, 0.5);
  fitCells([body.querySelector(".cc")]);
  const m = measure(body);
  check(`it is squeezed no further than ${CELL_SQUEEZE_MIN}`, m.scale === CELL_SQUEEZE_MIN, String(m.scale));
  check("the next column moves over only as far as it must", near(m.nextLeft - m.left, t * CELL_SQUEEZE_MIN + SPACE), `${r1(m.nextLeft - m.left)} vs ${r1(t * CELL_SQUEEZE_MIN + SPACE)}`);
  check("…and the two never touch", m.textRight <= m.nextLeft - SPACE + 1, `${r1(m.textRight)} vs ${r1(m.nextLeft - SPACE)}`);
}

out.push("a pseudonym with a word on a second column:");
{
  // Column 21 is a second column here: text beside it on two lines, a third
  // line beginning at it. The name's third word stands on it.
  const fake = "Weddell Of Sharnbrook Of Livesey Brindley";
  const prose = ["Defendant ", { fake, real: "Acme Holdings Group" }, " moved to dismiss."];
  const body = page([
    ["Plaintiff:" + " ".repeat(11) + "Jane Roe"],
    ["Counsel:" + " ".repeat(13) + "Pat Smith"],
    prose,
    ["Defendant " + fake + " moved to dismiss."],
    [" ".repeat(21) + "Los Angeles, CA 90012"],
  ], cw.char * SIZE);
  const [, , named, plain] = body.querySelectorAll(".line");
  check("the same words as plain text are cut there (the column is real)", !!plain.querySelector(".cc"), plain.innerHTML.slice(0, 120));
  const pn = named.querySelector(".pn");
  check("the name is not cut into a column", !pn.closest(".cc"), named.innerHTML.slice(0, 120));
  fitCells([...body.querySelectorAll(".cc")]);
  let squeezed = null;
  for (let el = pn; el && el !== body; el = el.parentElement) if (el.style.transform) squeezed = el;
  check("…and is drawn at its own width", !squeezed, squeezed ? squeezed.style.transform : "");
}

out.push("a form whose column runs down part of the page:");
{
  // A caption with its box at column 37 beside three lines, then the form's
  // prose further down, with a word that happens to stand at 37.
  const prose = "1. TO THE CLERK: Please dismiss this action as follows";
  const rows = [
    ["ATTORNEY OR PARTY WITHOUT ATTORNEY" + " ".repeat(3) + "FOR COURT USE ONLY"],
    ["NAME:" + " ".repeat(32) + "(court stamp)"],
    [prose],
    ["FIRM NAME:" + " ".repeat(27) + "(court stamp)"],
    ...Array.from({ length: 8 }, () => [""]),
    [prose],
    ["   and of all parties."],
  ];
  const body = page(rows, cw.char * SIZE);
  const lines = body.querySelectorAll(".line");
  check("the prose sits on the column (a word at 37, one space before it)", prose[37 - 1] === " " && prose[37] !== " " && prose[37 - 2] !== " ", JSON.stringify(prose.slice(32, 42)));
  check("beside the caption's box, it is cut at the box's column", !!lines[2].querySelector(".cc"), lines[2].innerHTML.slice(0, 120));
  check("under the caption, where the box does not run, it is one line of prose", !lines[12].querySelector(".cc"), lines[12].innerHTML.slice(0, 120));
}

out.push("off the PDF's grid, a second column at one place down a justified page:");
{
  // The flowing view (no .fixed): the user's contract, a justified page in two
  // columns, with a line of capitals among it. On the font's average grid the
  // left-hand pieces ran past the column by their own amounts, and the lines
  // that reach it with a space or two were not cut at all.
  const L = (left, right, at = 62, lead = 1) => { const s = " ".repeat(lead) + left; return s + " ".repeat(Math.max(1, at - s.length)) + right; };
  const rows = [
    L("each Guarantor authorize Windermere to use its, his, or her", "not waive any other Event of Default. None of the"),
    L("name, city, and state in a listing of Windermere's customers", "provisions of this Agreement may be waived except by a"),
    L("ensure proper service, Windermere may choose to monitor", "and delivered to Borrower. The provisions of this"),
    L("call between Windermere and Borrower (or its representative)", "reimburse Windermere for all reasonable attorneys'"),
    L("CUSTOMERS OR OTHER THIRD PARTIES. BORROWER AGREES THAT", "signed by   Borrower   and   Windermere. Borrower will"),
    L("", "firm specializing in debt collection in connection", 62, 0),
    L("may be monitored and/or recorded for this purpose.", "fees (in the event Windermere utilizes a third party law", 61, 0),
  ];
  const sec = document.createElement("section");
  sec.className = "tpage";
  sec.style.setProperty("--reader-size-eff", SIZE + "px");
  sec.style.width = "1300px"; // a page fitted so its column lines are each one line (shapePages)
  sec.innerHTML = '<div class="page-inner" style="height:auto"><div class="page-body"></div></div>';
  const body = sec.querySelector(".page-body");
  for (const text of rows) {
    const line = document.createElement("div");
    line.className = "line";
    const lt = document.createElement("span");
    lt.className = "lt";
    lt.textContent = text;
    line.append(lt);
    body.append(line);
  }
  pages.append(sec);
  dressColumns(body);
  alignColumns([body]);
  const lts = [...body.querySelectorAll(".lt")];
  const at = (node, i) => { const r = document.createRange(); r.setStart(node, i); r.setEnd(node, i + 1); return r.getBoundingClientRect().left; };
  /** Where the right-hand column's text begins on a line, and where the text to its left ends. */
  const cols = () => lts.map((lt) => {
    const cell = lt.querySelector(".cc");
    if (!cell) { const t = lt.firstChild; return { col: at(t, t.data.search(/\S/)), end: null }; }
    const r = document.createRange();
    r.setStart(cell, 0);
    r.setEndBefore(cell.querySelector(".cg"));
    return { col: at(cell.nextSibling, 0), end: r.getBoundingClientRect().right };
  });
  const unit = cw.char * SIZE;
  const c = cols();
  const xs = c.map((x) => x.col);
  const cut = lts.filter((lt) => lt.querySelector(".cc")).length;
  check("every line is cut at the column, the ones running up to it with a space or two as well", cut === rows.length - 1, `${cut} of ${rows.length - 1}`);
  check("the right-hand column begins at one place on every line", Math.max(...xs) - Math.min(...xs) <= 1, xs.map(r1).join(" "));
  const gap = Math.min(...c.filter((x) => x.end != null).map((x) => x.col - x.end));
  check("…a gutter of four grid characters clear of the widest text to its left, capitals and all", gap >= 4 * unit - 1, `${r1(gap)} vs ${r1(4 * unit)}`);
  // The places are written in the body's type: the page fitted smaller to its
  // paper takes them with it.
  sec.style.setProperty("--fit", "0.6");
  const small = cols().map((x) => x.col);
  check("the page set smaller keeps its column straight", Math.max(...small) - Math.min(...small) <= 1, small.map(r1).join(" "));
  sec.style.removeProperty("--fit");
  // A line no longer beside the column goes back on the plain grid.
  lts[2].textContent = "ensure proper service, Windermere may choose to monitor";
  for (const lt of lts.slice(3)) lt.textContent = "";
  dressColumns(body);
  alignColumns([body]);
  const left = body.querySelectorAll(".cx").length;
  check("a line no longer beside a second column is back on the plain grid", left === 0, `${left} still placed`);
}

out.push("", `${"=".repeat(52)}`, `FAILURES: ${fails}`);
document.getElementById("report").innerHTML = out.join("\n");
document.title = fails ? `FAIL (${fails})` : "PASS";
window.__fails = fails;
</script>
</body>
</html>
