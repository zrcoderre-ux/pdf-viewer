<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Column cell test</title>
<!-- The columns an export lays out with spaces, held to the PDF's grid side
     by side (viewer/columns.js: dressColumns, fitCells). Where a line is cut
     is tested in node (test-textdoc.mjs); what needs a page is the measuring:
     a piece before a column drawn at its own width wherever the blank before
     the next column has room for it, squeezed only where it would run into
     that column's text and never below three quarters, and a pseudonym never
     cut. Each case is its own page, its grid's character chosen from the
     piece's own measured width so the case lands where it is meant to.
     Open it over http (an ES module will not import from a file:// page):
       npx http-server -p 8080 . → http://127.0.0.1:8080/test-columns.html -->
<link rel="stylesheet" href="viewer/text-reader.css">
<style>
  #report { font-family: monospace; padding: 16px 20px; white-space: pre; }
  #report .pass { color: #1b7f3b; }
  #report .fail { color: #b3261e; font-weight: 700; }
  #stage { position: absolute; left: -4000px; top: 0; width: 1400px; font-family: Georgia, serif; }
  .page-inner { height: 160px; }
</style>
</head>
<body>
<div id="report">running…</div>
<div id="stage"><div id="pages"></div></div>
<script type="module">
import { dressColumns, alignColumns, fitCells, charWidth, placeLine, unplaceLine, lineMap, CELL_SQUEEZE_MIN } from "./viewer/columns.js";
import { serializeNodes } from "./viewer/textdoc.js";

const stage = document.getElementById("stage");
const pages = document.getElementById("pages");
const SIZE = 16;
const cw = charWidth(getComputedStyle(stage).fontFamily);
document.documentElement.style.setProperty("--col-n", String(cw.char));
document.documentElement.style.setProperty("--col-sp-n", String(cw.space));
const SPACE = cw.space * SIZE;

/** A page laid on the PDF's grid, its lines given as strings and { fake, real, shown } pseudonyms. */
function page(rows, unit) {
  const sec = document.createElement("section");
  sec.className = "tpage matched";
  sec.innerHTML = '<div class="page-inner"><div class="page-body fixed cgrid"></div></div>';
  const body = sec.querySelector(".page-body");
  body.style.setProperty("--grid-em", SIZE + "px");
  body.style.setProperty("--grid-col", unit + "px");
  rows.forEach((parts, k) => {
    const line = document.createElement("div");
    line.className = "line";
    line.style.top = k * 24 + "px";
    line.style.fontSize = SIZE + "px";
    line.style.lineHeight = "20px";
    const lt = document.createElement("span");
    lt.className = "lt";
    for (const p of parts) {
      if (typeof p === "string") { lt.append(p); continue; }
      const s = document.createElement("span");
      s.className = "pn";
      s.contentEditable = "false";
      s.dataset.fake = p.fake;
      s.dataset.real = p.real;
      s.textContent = p.shown === "real" ? p.real : p.fake;
      lt.append(s);
    }
    line.append(lt);
    body.append(line);
  });
  pages.append(sec);
  dressColumns(body);
  return body;
}
/** A piece's own width in the reader's font, at the line's size. */
function natural(parts) {
  const probe = document.createElement("span");
  probe.style.cssText = `position:absolute;white-space:pre;font-size:${SIZE}px`;
  probe.textContent = parts.map((p) => (typeof p === "string" ? p : p.shown === "real" ? p.real : p.fake)).join("");
  stage.append(probe);
  const w = probe.getBoundingClientRect().width;
  probe.remove();
  return w;
}
/** Where a two-column line's cell, its text, and the next column's text stand. */
function measure(body) {
  const cell = body.querySelector(".cc");
  const r = document.createRange();
  r.setStart(cell, 0);
  r.setEndBefore(cell.querySelector(".cg"));
  const next = cell.nextSibling;
  const n = document.createRange();
  n.setStart(next, 0);
  n.setEnd(next, 1);
  const m = /scaleX\(([\d.]+)\)/.exec(cell.style.transform);
  return {
    left: cell.getBoundingClientRect().left,
    textRight: r.getBoundingClientRect().right,
    nextLeft: n.getBoundingClientRect().left,
    min: parseFloat(getComputedStyle(cell).minWidth),
    pad: parseFloat(getComputedStyle(cell).paddingRight),
    scale: m ? parseFloat(m[1]) : 1,
  };
}

const out = [];
let fails = 0;
const check = (label, ok, note = "") => {
  if (!ok) fails++;
  out.push(`<span class="${ok ? "pass" : "fail"}">  ${ok ? "PASS" : "FAIL"}  ${label}${note && !ok ? "\n        " + note : ""}</span>`);
};
const near = (a, b, tol = 1) => Math.abs(a - b) <= tol;
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const r1 = (x) => Math.round(x * 10) / 10;

// A two-column line: its left-hand piece, three spaces, the next column. The
// grid's character is chosen so the blank before the next column, a space
// short of it, is `share` of the piece's own width.
const LEFT = "Defendant Acme Holdings Group, Inc.";
const twoCol = (left, share, shown) => {
  const fileLen = left.reduce((n, p) => n + (typeof p === "string" ? p : p.fake).length, 0);
  const cols = fileLen + 3;
  const t = natural(left);
  const unit = (share * t + SPACE) / cols;
  const body = page([[...left, "   ", "Case No. 24STCV01234"]], unit);
  return { body, t, unit, cols };
};

out.push("a piece that fits in the blank before the next column:");
{
  const { body, t } = twoCol([LEFT], 1.03);
  const cell = body.querySelector(".cc");
  const before = measure(body);
  check("the case is one the cell's margin alone would have squeezed", t > before.min - before.pad, `${r1(t)} vs ${r1(before.min - before.pad)}`);
  fitCells([cell]);
  const m = measure(body);
  check("it is drawn at its own width", m.scale === 1 && !cell.style.transform, cell.style.transform);
  check("the next column stays on the grid", near(m.nextLeft - m.left, m.min), `${r1(m.nextLeft - m.left)} vs ${r1(m.min)}`);
  check("…with at least a space between them", m.textRight <= m.nextLeft - SPACE + 1, `${r1(m.textRight)} vs ${r1(m.nextLeft - SPACE)}`);
  fitCells([cell]);
  const again = measure(body);
  check("a second pass finds the same", again.scale === 1 && near(again.nextLeft, m.nextLeft, 0.5), `${again.scale} ${r1(again.nextLeft)} vs ${r1(m.nextLeft)}`);
  cell.firstChild.data += " and Affiliates";
  fitCells([cell]);
  const longer = measure(body);
  check("…and a piece grown since is measured afresh, not held to the old width", longer.scale < 1 && longer.textRight <= longer.nextLeft - SPACE + 1, `${longer.scale} ${r1(longer.textRight)} vs ${r1(longer.nextLeft)}`);
}

out.push("a piece that would run into the next column:");
{
  const { body } = twoCol([LEFT], 0.9);
  fitCells([body.querySelector(".cc")]);
  const m = measure(body);
  check("it is squeezed by what it would overrun, no more", near(m.scale, 0.9, 0.01), String(m.scale));
  check("the next column stays on the grid", near(m.nextLeft - m.left, m.min), `${r1(m.nextLeft - m.left)} vs ${r1(m.min)}`);
  check("…with a space between them", m.textRight <= m.nextLeft - SPACE + 1, `${r1(m.textRight)} vs ${r1(m.nextLeft - SPACE)}`);
}

out.push("a piece far too wide (a real name twice its fake's length):");
{
  const left = ["Plaintiff ", { fake: "Pat Doe", real: "Weddell Of Sharnbrook Of Livesey Brindley", shown: "real" }];
  const { body, t } = twoCol(left, 0.5);
  fitCells([body.querySelector(".cc")]);
  const m = measure(body);
  check(`it is squeezed no further than ${CELL_SQUEEZE_MIN}`, m.scale === CELL_SQUEEZE_MIN, String(m.scale));
  check("the next column moves over only as far as it must", near(m.nextLeft - m.left, t * CELL_SQUEEZE_MIN + SPACE), `${r1(m.nextLeft - m.left)} vs ${r1(t * CELL_SQUEEZE_MIN + SPACE)}`);
  check("…and the two never touch", m.textRight <= m.nextLeft - SPACE + 1, `${r1(m.textRight)} vs ${r1(m.nextLeft - SPACE)}`);
}

out.push("a pseudonym with a word on a second column:");
{
  // Column 21 is a second column here: text beside it on two lines, a third
  // line beginning at it. The name's third word stands on it.
  const fake = "Weddell Of Sharnbrook Of Livesey Brindley";
  const prose = ["Defendant ", { fake, real: "Acme Holdings Group" }, " moved to dismiss."];
  const body = page([
    ["Plaintiff:" + " ".repeat(11) + "Jane Roe"],
    ["Counsel:" + " ".repeat(13) + "Pat Smith"],
    prose,
    ["Defendant " + fake + " moved to dismiss."],
    [" ".repeat(21) + "Los Angeles, CA 90012"],
  ], cw.char * SIZE);
  const [, , named, plain] = body.querySelectorAll(".line");
  check("the same words as plain text are cut there (the column is real)", !!plain.querySelector(".cc"), plain.innerHTML.slice(0, 120));
  const pn = named.querySelector(".pn");
  check("the name is not cut into a column", !pn.closest(".cc"), named.innerHTML.slice(0, 120));
  fitCells([...body.querySelectorAll(".cc")]);
  let squeezed = null;
  for (let el = pn; el && el !== body; el = el.parentElement) if (el.style.transform) squeezed = el;
  check("…and is drawn at its own width", !squeezed, squeezed ? squeezed.style.transform : "");
}

out.push("a form whose column runs down part of the page:");
{
  // A caption with its box at column 37 beside three lines, then the form's
  // prose further down, with a word that happens to stand at 37.
  const prose = "1. TO THE CLERK: Please dismiss this action as follows";
  const rows = [
    ["ATTORNEY OR PARTY WITHOUT ATTORNEY" + " ".repeat(3) + "FOR COURT USE ONLY"],
    ["NAME:" + " ".repeat(32) + "(court stamp)"],
    [prose],
    ["FIRM NAME:" + " ".repeat(27) + "(court stamp)"],
    ...Array.from({ length: 8 }, () => [""]),
    [prose],
    ["   and of all parties."],
  ];
  const body = page(rows, cw.char * SIZE);
  const lines = body.querySelectorAll(".line");
  check("the prose sits on the column (a word at 37, one space before it)", prose[37 - 1] === " " && prose[37] !== " " && prose[37 - 2] !== " ", JSON.stringify(prose.slice(32, 42)));
  check("beside the caption's box, it is cut at the box's column", !!lines[2].querySelector(".cc"), lines[2].innerHTML.slice(0, 120));
  check("under the caption, where the box does not run, it is one line of prose", !lines[12].querySelector(".cc"), lines[12].innerHTML.slice(0, 120));
}

out.push("off the PDF's grid, a second column at one place down a justified page:");
{
  // The flowing view (no .fixed): the user's contract, a justified page in two
  // columns, with a line of capitals among it. On the font's average grid the
  // left-hand pieces ran past the column by their own amounts, and the lines
  // that reach it with a space or two were not cut at all.
  const L = (left, right, at = 62, lead = 1) => { const s = " ".repeat(lead) + left; return s + " ".repeat(Math.max(1, at - s.length)) + right; };
  const rows = [
    L("each Guarantor authorize Windermere to use its, his, or her", "not waive any other Event of Default. None of the"),
    L("name, city, and state in a listing of Windermere's customers", "provisions of this Agreement may be waived except by a"),
    L("ensure proper service, Windermere may choose to monitor", "and delivered to Borrower. The provisions of this"),
    L("call between Windermere and Borrower (or its representative)", "reimburse Windermere for all reasonable attorneys'"),
    L("CUSTOMERS OR OTHER THIRD PARTIES. BORROWER AGREES THAT", "signed by   Borrower   and   Windermere. Borrower will"),
    L("", "firm specializing in debt collection in connection", 62, 0),
    L("may be monitored and/or recorded for this purpose.", "fees (in the event Windermere utilizes a third party law", 61, 0),
  ];
  const sec = document.createElement("section");
  sec.className = "tpage";
  sec.style.setProperty("--reader-size-eff", SIZE + "px");
  sec.style.width = "1300px"; // a page fitted so its column lines are each one line (shapePages)
  sec.innerHTML = '<div class="page-inner" style="height:auto"><div class="page-body"></div></div>';
  const body = sec.querySelector(".page-body");
  for (const text of rows) {
    const line = document.createElement("div");
    line.className = "line";
    const lt = document.createElement("span");
    lt.className = "lt";
    lt.textContent = text;
    line.append(lt);
    body.append(line);
  }
  pages.append(sec);
  dressColumns(body);
  alignColumns([body]);
  const lts = [...body.querySelectorAll(".lt")];
  const at = (node, i) => { const r = document.createRange(); r.setStart(node, i); r.setEnd(node, i + 1); return r.getBoundingClientRect().left; };
  /** Where the right-hand column's text begins on a line, and where the text to its left ends. */
  const cols = () => lts.map((lt) => {
    const cell = lt.querySelector(".cc");
    if (!cell) { const t = lt.firstChild; return { col: at(t, t.data.search(/\S/)), end: null }; }
    const r = document.createRange();
    r.setStart(cell, 0);
    r.setEndBefore(cell.querySelector(".cg"));
    return { col: at(cell.nextSibling, 0), end: r.getBoundingClientRect().right };
  });
  const unit = cw.char * SIZE;
  const c = cols();
  const xs = c.map((x) => x.col);
  const cut = lts.filter((lt) => lt.querySelector(".cc")).length;
  check("every line is cut at the column, the ones running up to it with a space or two as well", cut === rows.length - 1, `${cut} of ${rows.length - 1}`);
  check("the right-hand column begins at one place on every line", Math.max(...xs) - Math.min(...xs) <= 1, xs.map(r1).join(" "));
  const gap = Math.min(...c.filter((x) => x.end != null).map((x) => x.col - x.end));
  check("…a gutter of four grid characters clear of the widest text to its left, capitals and all", gap >= 4 * unit - 1, `${r1(gap)} vs ${r1(4 * unit)}`);
  // The places are written in the body's type: the page fitted smaller to its
  // paper takes them with it.
  sec.style.setProperty("--fit", "0.6");
  const small = cols().map((x) => x.col);
  check("the page set smaller keeps its column straight", Math.max(...small) - Math.min(...small) <= 1, small.map(r1).join(" "));
  sec.style.removeProperty("--fit");
  // A line no longer beside the column goes back on the plain grid.
  lts[2].textContent = "ensure proper service, Windermere may choose to monitor";
  for (const lt of lts.slice(3)) lt.textContent = "";
  dressColumns(body);
  alignColumns([body]);
  const left = body.querySelectorAll(".cx").length;
  check("a line no longer beside a second column is back on the plain grid", left === 0, `${left} still placed`);
}

/** A flowing page (the reading view, off the PDF's grid), its lines given as strings. */
function flowPage(rows) {
  const sec = document.createElement("section");
  sec.className = "tpage";
  sec.style.setProperty("--reader-size-eff", SIZE + "px");
  sec.style.width = "1300px";
  sec.innerHTML = '<div class="page-inner" style="height:auto"><div class="page-body"></div></div>';
  const body = sec.querySelector(".page-body");
  for (const text of rows) {
    const line = document.createElement("div");
    line.className = "line";
    const lt = document.createElement("span");
    lt.className = "lt";
    lt.textContent = text;
    line.append(lt);
    body.append(line);
  }
  pages.append(sec);
  dressColumns(body);
  return body;
}
/** Where a node's text sits on its baseline: a probe of no size set in it, read and taken out again. */
function baselineOf(parent, before = null) {
  const probe = document.createElement("span");
  probe.style.cssText = "display:inline-block;width:0;height:0;vertical-align:baseline";
  parent.insertBefore(probe, before);
  const y = probe.getBoundingClientRect().top;
  probe.remove();
  return y;
}

// A form's checkboxes: "[   ]" holds three spaces, a gap between columns, and
// the columns cut it in half — a "[" ending one cell, "] Plaintiff" opening the
// next. Each spelling is one piece, drawn as a box, its characters underneath.
const MARKS = ["(TYPE OR PRINT NAME OF  [   ] ATTORNEY    [   ] PARTY WITHOUT ATTORNEY)" + " ".repeat(30) + "(SIGNATURE)",
  "causes of action    [ X ] Plaintiff/Petitioner [ ? ] Defendant/Respondent",
  "a.   [ ]  Complaint      [X]  Petition      [?]  Other (specify):"];
for (const view of ["flowing", "beside the PDF"]) {
  out.push(`a form's checkboxes, ${view}:`);
  const body = view === "flowing" ? flowPage(MARKS) : page(MARKS.map((t) => [t]), cw.char * SIZE);
  const boxes = [...body.querySelectorAll(".cb")];
  check("every mark is one box, its state on it", same(boxes.map((b) => [b.textContent, b.getAttribute("data-cb")]),
    [["[   ]", null], ["[   ]", null], ["[ X ]", "x"], ["[ ? ]", "?"], ["[ ]", null], ["[X]", "x"], ["[?]", "?"]]), JSON.stringify(boxes.map((b) => b.textContent)));
  const cells = [...body.querySelectorAll(".cc")].map((c) => [...c.childNodes].filter((n) => !(n.nodeType === 1 && n.classList.contains("cg"))).map((n) => n.textContent).join(""));
  check("no cell ends on a \"[\" or opens on a \"]\" — no cut falls inside a box", cells.length > 0 && cells.every((t) => !/\[\s*$/.test(t) && !/^\s*\]/.test(t)), JSON.stringify(cells));
  check("the page reads back as the file", serializeNodes(body) === MARKS.join("\n"), JSON.stringify(serializeNodes(body)));
  const b = boxes[2], cs = getComputedStyle(b), fs = parseFloat(cs.fontSize);
  const sq = getComputedStyle(b, "::before");
  check("a box is drawn as a square at its line's type size", near(parseFloat(sq.width), 0.74 * fs, 0.6) && near(parseFloat(sq.height), 0.74 * fs, 0.6) && parseFloat(sq.borderTopWidth) >= 1,
    `${sq.width} × ${sq.height}, border ${sq.borderTopWidth}, type ${fs}px`);
  check("…its characters underneath, unseen", cs.webkitTextFillColor === "rgba(0, 0, 0, 0)" || cs.webkitTextFillColor === "transparent", cs.webkitTextFillColor);
  check("…an X in a ticked one, a ? in one the run could not read, nothing in an empty one",
    same([2, 3, 0].map((i) => getComputedStyle(boxes[i], "::after").content), ['"X"', '"?"', "none"]), [2, 3, 0].map((i) => getComputedStyle(boxes[i], "::after").content).join(" "));
  const sizer = document.createElement("canvas").getContext("2d");
  sizer.font = `${cs.fontSize} ${cs.fontFamily}`;
  check("…taking exactly the room its characters do", near(b.getBoundingClientRect().width, sizer.measureText(b.textContent).width, 1), `${r1(b.getBoundingClientRect().width)} vs ${r1(sizer.measureText(b.textContent).width)}`);
  const r = b.getBoundingClientRect(), s = b.closest(".line").getBoundingClientRect();
  check("…on its line", r.top >= s.top - 1 && r.bottom <= s.bottom + 1, `${r1(r.top)}–${r1(r.bottom)} in ${r1(s.top)}–${r1(s.bottom)}`);
  document.body.classList.add("editing");
  const ed = getComputedStyle(b).display, edFill = getComputedStyle(b).webkitTextFillColor, edBox = getComputedStyle(b, "::before").content;
  document.body.classList.remove("editing");
  check("in the editor the mark is the text it is, to be typed into", ed === "inline" && edFill !== "rgba(0, 0, 0, 0)" && edBox === "none" && !b.hasAttribute("contenteditable"), `${ed} ${edFill} ${edBox}`);
  // An edit that makes a mark something else makes it text again; one that
  // makes it a mark again makes it a box.
  b.firstChild.data = "[ Y ]";
  dressColumns(body);
  check("a mark typed into something else is text again", !b.isConnected && body.querySelectorAll(".cb").length === 6 && serializeNodes(body).includes("[ Y ] Plaintiff"), String(body.querySelectorAll(".cb").length));
  const lt = body.querySelectorAll(".lt")[1];
  const walk = document.createTreeWalker(lt, NodeFilter.SHOW_TEXT);
  for (let t = walk.nextNode(); t; t = walk.nextNode()) if (t.data.includes("[ Y ]")) t.data = t.data.replace("[ Y ]", "[ X ]");
  dressColumns(body);
  check("…and typed back, a box again", body.querySelectorAll(".cb").length === 7 && serializeNodes(body) === MARKS.join("\n"), String(body.querySelectorAll(".cb").length));
}

// Beside its PDF a line is cut wherever one of the PDF's items begins (the
// line's `__grid`), and each piece is set at its item's x, at its item's size
// (columns.placeLine), and each run of it in its item's face (columns.faceLine,
// a wrapper inside the cell) — on its own line, on that line's baseline: the
// line numbers are the reader's grid down the page, and nothing here moves a
// line or a piece of one up or down.
out.push("side by side, each piece where the PDF prints it:");
{
  const FOOT = "* If dismissal requested is of specified parties only,";
  const text = FOOT + " Attorney or party without attorney for";
  const body = page([[text], ["the line under it"]], cw.char * SIZE);
  const [line, under] = body.querySelectorAll(".line");
  const lt = line.querySelector(".lt");
  const at = text.indexOf("Attorney");
  lt.__grid = { text, cuts: [at] };
  dressColumns(body);
  const cell = lt.querySelector(".cc");
  check("the PDF's cut is made where the export has only a space", !!cell && cell.__at === 0 && lt.lastChild.textContent === "Attorney or party without attorney for", lt.innerHTML.slice(0, 160));
  const sans = { family: 'Arial, "Liberation Sans", sans-serif', bold: false, italic: false };
  const bold = Object.assign({}, sans, { bold: true });
  const small = 12, big = 16; // the footnote and the label, px
  const runs = [{ from: at, to: text.length, face: bold }];
  placeLine(lt, { places: new Map([[0, { x: 0, size: small, face: sans }], [at, { x: 700, size: big, face: bold }]]), start: 0, at: (a) => a * 8, face: sans, size: small, lead: 0, runs });
  const tail = document.createRange();
  tail.setStart(lt.lastChild, 0);
  tail.setEnd(lt.lastChild, 1);
  const left = body.getBoundingClientRect().left;
  check("the label stands at its item's x", near(tail.getBoundingClientRect().left - left, 700, 0.6), r1(tail.getBoundingClientRect().left - left));
  const label = lt.lastChild;
  check("…at its own size, and its run in its own face (a wrapper, not the cell); the footnote at its own size and in the line's face",
    getComputedStyle(lt).fontSize === big + "px" && label.classList.contains("fc") && getComputedStyle(label).fontWeight === "700" && getComputedStyle(lt).fontWeight === "400"
      && getComputedStyle(cell).fontSize === small + "px" && getComputedStyle(cell).fontWeight === "400" && !cell.style.fontWeight,
    `${getComputedStyle(lt).fontSize} ${getComputedStyle(lt).fontWeight} ${label.className} ${getComputedStyle(label).fontWeight} / ${getComputedStyle(cell).fontSize} ${getComputedStyle(cell).fontWeight}`);
  const lb = line.getBoundingClientRect(), ub = under.getBoundingClientRect();
  const rects = [...(() => { const r = document.createRange(); r.selectNodeContents(lt); return r.getClientRects(); })()].filter((q) => q.width > 0);
  check("the line stands on its one row: every piece of it within its box, the line under it where it was",
    rects.every((q) => q.top >= lb.top - 1 && q.bottom <= lb.bottom + 1) && near(ub.top - body.getBoundingClientRect().top, 24, 0.5), `${rects.map((q) => r1(q.top) + "–" + r1(q.bottom)).join(" ")} in ${r1(lb.top)}–${r1(lb.bottom)}`);
  const base = baselineOf(lt), cellBase = baselineOf(cell, cell.querySelector(".cg"));
  check("…the smaller piece on the line's baseline, not raised or lowered to its own row's", near(base, cellBase, 0.5), `${r1(base)} vs ${r1(cellBase)}`);
  check("the page reads back as the file, cut and set or not", serializeNodes(body) === text + "\nthe line under it");
  check("placed again, nothing is written", (() => { const was = lt.outerHTML; placeLine(lt, { places: new Map([[0, { x: 0, size: small, face: sans }], [at, { x: 700, size: big, face: bold }]]), start: 0, at: (a) => a * 8, face: sans, size: small, lead: 0, runs }); return lt.outerHTML === was; })());
  check("taken off the grid, the PDF's cut, every place and every run's face go with it",
    (() => { const took = unplaceLine(lt); return took.cut && took.faced; })() && (dressColumns(body), !lt.querySelector(".cc") && !lt.querySelector(".fc")) && !lt.style.fontFamily && !lt.style.fontSize && !lt.style.fontWeight,
    lt.outerHTML.slice(0, 160));
  // A numbered page's line: nothing placed, the export's own columns on the
  // grid's widths, and the PDF's weight and slant run by run in the reader's
  // own type — a face with no family.
  const t3 = "QUILLON BRAKESMAN, an individual," + " ".repeat(12) + ") Case No. 1";
  const b3x = page([[t3]], 8);
  const lt3 = b3x.querySelector(".lt");
  const plain = { family: "", bold: false, italic: false }, heavy = { family: "", bold: true, italic: false };
  const moved = placeLine(lt3, { places: null, start: null, at: null, face: plain, size: SIZE, lead: 0, runs: [{ from: 0, to: 18, face: heavy }] });
  const c3 = lt3.querySelector(".cc"), f3 = lt3.querySelector(".fc");
  check("faces alone: the name's run in bold inside the cell, the rest of the line regular, no family and no width written",
    moved && !!c3 && !!f3 && c3.contains(f3) && f3.textContent === "QUILLON BRAKESMAN," && getComputedStyle(f3).fontWeight === "700" && getComputedStyle(lt3).fontWeight === "400"
      && !lt3.style.fontFamily && !c3.style.minWidth && serializeNodes(b3x) === t3,
    lt3.outerHTML.slice(0, 200));
  check("…faced again as before, nothing is written", !placeLine(lt3, { places: null, start: null, at: null, face: plain, size: SIZE, lead: 0, runs: [{ from: 0, to: 18, face: heavy }] }));
  check("…and taken off, the line is the reader's own again", unplaceLine(lt3).faced && !lt3.querySelector(".fc") && !lt3.style.fontWeight && serializeNodes(b3x) === t3, lt3.outerHTML.slice(0, 160));
  // The PDF prints what the page SHOWS — the real names — and the cells are
  // cut in the FILE, under the fakes: a place on screen read as its place in
  // the file, none inside a name.
  const b3 = page([["Served on ", { fake: "Pat Doe", real: "Rosamund Delacroix-Vane", shown: "real" }, "    Case No. 1"]], 8);
  const map = lineMap(b3.querySelector(".lt"));
  check("a place on screen is its place in the file, a name's real length and all",
    same([map.fileAt(0), map.fileAt(10), map.fileAt(15), map.fileAt(33), map.fileAt(37), map.fileAt(47), map.atoms], [0, 10, -1, 17, 21, 31, [[10, 33]]]),
    JSON.stringify([map.fileAt(0), map.fileAt(10), map.fileAt(15), map.fileAt(33), map.fileAt(37), map.fileAt(47), map.atoms]));
  // A piece the PDF did not place keeps the grid's place.
  const t2 = "Date:" + " ".repeat(20) + "Clerk, by" + " ".repeat(20) + ", Deputy";
  const b2 = page([[t2]], 8);
  const lt2 = b2.querySelector(".lt");
  placeLine(lt2, { places: new Map([[0, { x: 0, size: SIZE, face: sans }], [25, { x: 300, size: SIZE, face: sans }]]), start: 0, at: (a) => a * 8, face: sans, size: SIZE, lead: 0 });
  const c2 = lt2.querySelectorAll(".cc");
  check("a piece no item placed keeps the grid's place", near(parseFloat(c2[1].style.minWidth), 54 * 8 - 300, 0.01), c2[1].style.minWidth);
}

out.push("", `${"=".repeat(52)}`, `FAILURES: ${fails}`);
document.getElementById("report").innerHTML = out.join("\n");
document.title = fails ? `FAIL (${fails})` : "PASS";
window.__fails = fails;
</script>
